[package]
name = "spideyverse"
version = "0.1.0"
description = "SpideyVerse: a 3D Spider-Man game with a Jarvis AI director"
authors = ["you"]
license = ""
repository = ""
default-run = "spideyverse"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-process = "2"

